<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTED AI</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #061b14, #020705);
    color: #00ff88;
    text-align: center;
}

/* glow */
h1 {
    font-size: 60px;
    margin-top: 100px;
    text-shadow: 0 0 20px #00ff88;
}

p {
    color: #aaa;
}

/* button */
.btn {
    margin-top: 40px;
    padding: 15px 30px;
    font-size: 18px;
    background: #00ff88;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    color: black;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px #00ff88;
}

/* sections */
.section {
    margin-top: 80px;
    padding: 20px;
}

.card {
    border: 1px solid #00ff88;
    margin: 10px auto;
    padding: 10px;
    width: 60%;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>WASTED AI</h1>
<p>Next-gen intelligent AI system</p>

<!-- USE NOW BUTTON -->
<a href="/chat">
    <button class="btn">🚀 Use Now</button>
</a>

<div class="section">
    <h2>⚡ Features</h2>
    <div class="card">Smart AI Chat Interface</div>
    <div class="card">Fast AI responses</div>
    <div class="card">Clean futuristic UI</div>
</div>

<div class="section">
    <h2>🔥 Why Use It</h2>
    <div class="card">Simple and fast AI access</div>
    <div class="card">Built for creators & students</div>
</div>

</body>
</html>
