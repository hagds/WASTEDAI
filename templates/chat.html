<!DOCTYPE html>
<html>
<head>
<title>Wasted AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

body{
margin:0;
font-family:Inter;
height:100vh;
display:flex;
background:#050b0f;
color:white;
overflow:hidden;
}

/* 🌿 BACKGROUND ANIMATION */
body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background: radial-gradient(circle, rgba(0,255,140,0.12) 2px, transparent 2px);
background-size:60px 60px;
animation: move 18s linear infinite;
z-index:0;
}

@keyframes move{
from{transform:translate(0,0);}
to{transform:translate(-200px,-200px);}
}

/* SIDEBAR */
.sidebar{
width:320px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(18px);
z-index:2;
display:flex;
flex-direction:column;
padding:10px;
border-right:1px solid rgba(0,255,140,0.2);
overflow:auto;
}

/* NEW CHAT BUTTON */
.newchat{
padding:12px;
border:none;
border-radius:10px;
background:#00ff88;
color:black;
font-weight:600;
cursor:pointer;
margin-bottom:10px;
}

.newchat:hover{
box-shadow:0 0 12px #00ff88;
}

/* CHAT ITEM */
.chat-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
margin:5px 0;
background:rgba(255,255,255,0.06);
border-radius:10px;
cursor:pointer;
}

.chat-item:hover{
background:#00ff88;
color:black;
}

.dots{
cursor:pointer;
padding:5px;
}

/* CHAT AREA */
.chat{
flex:1;
display:flex;
flex-direction:column;
z-index:2;
}

/* MESSAGES */
.messages{
flex:1;
padding:20px;
overflow:auto;
}

.msg{
max-width:70%;
padding:12px;
margin:10px 0;
border-radius:12px;
white-space:pre-wrap;
word-break:break-word;
}

.user{
background:#00ff88;
color:black;
margin-left:auto;
}

.ai{
background:rgba(255,255,255,0.08);
}

/* INPUT */
.inputbar{
display:flex;
padding:15px;
background:rgba(255,255,255,0.04);
border-top:1px solid rgba(0,255,140,0.2);
}

input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.1);
color:white;
outline:none;
}

button.send{
margin-left:10px;
padding:12px 18px;
border:none;
border-radius:10px;
background:#00ff88;
font-weight:600;
cursor:pointer;
}

/* MODAL */
.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
z-index:10;
}

.box{
background:#111827;
padding:20px;
border-radius:10px;
text-align:center;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<button class="newchat" onclick="newChat()">＋ New Chat</button>

<div id="chatList"></div>

</div>

<!-- CHAT -->
<div class="chat">

<div class="messages" id="messages"></div>

<div class="inputbar">
<input id="input" placeholder="Ask Wasted AI...">
<button class="send" onclick="send()">Send</button>
</div>

</div>

<!-- DELETE MODAL -->
<div class="modal" id="modal">
<div class="box">
<p>Are you sure you want to delete this chat?</p>
<button onclick="confirmDelete()">Yes</button>
<button onclick="closeModal()">No</button>
</div>
</div>

<script>

let chats = JSON.parse(localStorage.getItem("chats") || "[]");
let currentChat = null;
let deleteIndex = null;

/* ===================== UI ===================== */

function add(text,type){
let div=document.createElement("div");
div.className="msg "+type;
div.innerText=text;
document.getElementById("messages").appendChild(div);
}

/* ===================== NEW CHAT ===================== */

function newChat(){
currentChat = null;
document.getElementById("messages").innerHTML="";
document.getElementById("input").focus();
}

/* ===================== OPEN CHAT ===================== */

function openChat(i){
currentChat = i;
document.getElementById("messages").innerHTML="";

let chat = chats[i];
if(!chat.messages) chat.messages=[];

chat.messages.forEach(m=>{
add(m.text,m.role);
});
}

/* ===================== DELETE ===================== */

function askDelete(i){
deleteIndex = i;
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
deleteIndex=null;
}

function confirmDelete(){
chats.splice(deleteIndex,1);
localStorage.setItem("chats",JSON.stringify(chats));
loadChats();
document.getElementById("messages").innerHTML="";
closeModal();
}

/* ===================== LOAD CHATS ===================== */

function loadChats(){
let list=document.getElementById("chatList");
list.innerHTML="";

chats.forEach((c,i)=>{
let div=document.createElement("div");
div.className="chat-item";

div.onclick = ()=>openChat(i);

div.innerHTML=`
<span>${c.name || "New Chat"}</span>
<span class="dots" onclick="event.stopPropagation(); askDelete(${i})">⋮</span>
`;

list.appendChild(div);
});
}

/* ===================== SEND ===================== */

function send(){
let input=document.getElementById("input");
let msg=input.value;
if(!msg) return;

add(msg,"user");

if(currentChat===null){
chats.push({
name:msg,
messages:[]
});
currentChat=chats.length-1;
}

chats[currentChat].messages.push({role:"user",text:msg});

input.value="";

fetch("/ask",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:msg})
})
.then(r=>r.json())
.then(d=>{

let reply="✨ "+d.data;

add(reply,"ai");

chats[currentChat].messages.push({role:"ai",text:reply});

/* auto name */
chats[currentChat].name = chats[currentChat].messages[0].text;

localStorage.setItem("chats",JSON.stringify(chats));
loadChats();
});
}

/* INIT */
loadChats();

</script>

</body>
</html>
