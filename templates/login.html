<!DOCTYPE html>
<html>
<head>
<title>Wasted AI Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050b0f;
color:white;
}

/* BOX */
.box{
width:90%;
max-width:380px;
padding:25px;
border-radius:15px;
background:rgba(255,255,255,0.06);
text-align:center;
border:1px solid #00ff88;
}

/* TITLE */
h2{
color:#00ff88;
}

/* INPUT */
input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.1);
color:white;
outline:none;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#00ff88;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

/* SWITCH */
.switch{
margin-top:10px;
font-size:14px;
color:#aaa;
}

.switch a{
color:#00ff88;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>✨ Wasted AI</h2>

<!-- LOGIN -->
<form action="/login" method="POST">
<input name="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<div class="switch">
Don't have account? <a onclick="showRegister()">Register</a>
</div>

<!-- REGISTER -->
<form id="registerForm" action="/register" method="POST" style="display:none;">
<input name="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Register</button>
</form>

<div class="switch" id="backLogin" style="display:none;">
Already have account? <a onclick="showLogin()">Login</a>
</div>

</div>

<script>
function showRegister(){
document.querySelector("form[action='/login']").style.display="none";
document.getElementById("registerForm").style.display="block";
document.getElementById("backLogin").style.display="block";
}

function showLogin(){
document.querySelector("form[action='/login']").style.display="block";
document.getElementById("registerForm").style.display="none";
document.getElementById("backLogin").style.display="none";
}
</script>

</body>
</html>
